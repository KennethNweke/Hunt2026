<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Treasure Hunt – Claim Your Victory</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --accent:#3fb950; --card:#161b22; --bad:#f85149; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --fg:#1f2328; --accent:#1a7f37; --card:#ffffff; --bad:#cf222e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: ui-monospace, "Courier New", monospace; padding:1rem; }
  main { background:var(--card); padding:2rem; border-radius:12px; width:min(560px,100%); text-align:center;
         border:1px solid color-mix(in srgb, var(--fg) 15%, transparent); position:relative; z-index:2; }
  h1 { color:var(--accent); margin-top:0; }
  input { width:100%; padding:.8rem; font:inherit; border-radius:8px; margin:1rem 0;
          border:1px solid color-mix(in srgb, var(--fg) 30%, transparent); background:var(--bg); color:var(--fg); }
  button { font:inherit; padding:.8rem 1.6rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #msg { margin-top:1rem; min-height:1.5rem; }
  .bad { color:var(--bad); } .win { color:var(--accent); font-size:1.6rem; }
  canvas { position:fixed; inset:0; pointer-events:none; z-index:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <h1>&gt;_ Enter the Key</h1>
  <p>Found the flag? Paste it below.</p>
  <input id="key" placeholder="FLAG-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
  <button id="go">Submit</button>
  <div id="msg" role="status"></div>
</main>
<script>
// Paste the lines from: sudo cat /root/ctf_admin/hashes.js
const HASHES = {
  // "sha256hash": "Team 1",
};

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

const msg = document.getElementById("msg");
async function check() {
  const key = document.getElementById("key").value.trim();
  const team = HASHES[await sha256(key)];
  if (team) {
    msg.className = "win";
    msg.textContent = "🏆 " + team + " has won the hunt! 🏆";
    confetti();
  } else {
    msg.className = "bad";
    msg.textContent = "That key isn't right. Keep hunting!";
  }
}
document.getElementById("go").onclick = check;
document.getElementById("key").addEventListener("keydown", e => { if (e.key === "Enter") check(); });

// Minimal canvas confetti
function confetti() {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#f85149","#d29922","#3fb950","#58a6ff","#bc8cff"];
  const bits = Array.from({length:220}, () => ({
    x: Math.random()*cv.width, y: -Math.random()*cv.height,
    w: 6+Math.random()*6, h: 10+Math.random()*8, vy: 2+Math.random()*4,
    vx: -1+Math.random()*2, r: Math.random()*6, vr: -.2+Math.random()*.4,
    c: colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h); ctx.restore();
    });
    if (++frames < 400) requestAnimationFrame(draw); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
</script>
</body>
</html>
